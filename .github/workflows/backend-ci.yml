name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Lint & Pytest with PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vyaapardb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest anyio

      - name: Lint codebase with Ruff
        run: ruff check backend tests

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vyaapardb
          PYTHONPATH: .
        run: alembic upgrade head

      - name: Run Pytest suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vyaapardb
          SECRET_KEY: ci-test-secret-key-32-chars-long!
          ENV: testing
          PYTHONPATH: backend
        run: pytest -v --tb=short
