name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        env:
          PYTHONPATH: backend
        run: ruff check backend tests

      - name: Test
        working-directory: .
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vyaapardb
          SECRET_KEY: ci-secret
          ENV: testing
          PYTHONPATH: backend
        run: pytest -q