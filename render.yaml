# Render Blueprint for VyaparKitaab (1-Click Full-Stack Deployment)
databases:
  - name: vyaaparkitaab-db
    databaseName: vyaapardb
    user: vyaapar_user
    plan: free

services:
  # 1. FastAPI Backend Web Service (Docker image bundles tesseract-ocr for receipt OCR)
  - type: web
    name: vyaaparkitaab-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vyaaparkitaab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://vyaaparkitaab-web.onrender.com
      - key: OTP_PROVIDER
        value: smtp_email
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: PAYMENT_GATEWAY
        value: razorpay
      - key: PAYMENT_KEY_ID
        sync: false
      - key: PAYMENT_KEY_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: BANK_DATA_PROVIDER
        value: mock
      - key: SETU_AA_CLIENT_ID
        sync: false
      - key: SETU_AA_CLIENT_SECRET
        sync: false
      - key: SETU_AA_PRODUCT_INSTANCE_ID
        sync: false
      - key: OCR_DEFAULT_LANG
        value: auto
      - key: GEMINI_API_KEY
        sync: false

  # 2. React + Vite Static Frontend (Zero Secrets Exposed)
  - type: web
    name: vyaaparkitaab-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://vyaaparkitaab-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
